# jjh7757/TIL의 AWS배포환경/templates/deploy.yml을 복사하고 APP_NAME을 채운 것.
# 브랜치는 템플릿의 master 대신 이 저장소의 실제 기본 브랜치인 main으로 수정.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC로 임시 자격증명을 받기 위해 필요. 장기 액세스 키를 만들지 않는 핵심.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  APP_NAME: virtual-financial-services
  INSTANCE_ID: i-05ee0665bbba15a52

# 동시에 두 번 배포되지 않도록 (앞선 실행은 취소)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # 네이티브 arm64 러너. 퍼블릭 저장소는 무료, 프라이빗은 과금된다.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::403187831140:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 빌드 & ECR 푸시
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$APP_NAME"
          docker build --platform linux/arm64 -t "$IMAGE:$SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

      - name: SSM으로 배포
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy $APP_NAME" \
            --parameters "commands=[\"/usr/local/bin/deploy-app $APP_NAME $SHA\"]" \
            --query "Command.CommandId" --output text)
          echo "CommandId: $CMD_ID"

          sleep 5
          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)

          echo "----- 서버 출력 -----"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text >&2
          echo "---------------------"

          if [ "$STATUS" != "Success" ]; then
            echo "배포 실패: $STATUS"
            exit 1
          fi
          echo "배포 성공"
