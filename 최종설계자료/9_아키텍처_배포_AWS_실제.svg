<svg width="100%" viewBox="0 0 800 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title>실제 배포된 AWS 아키텍처 — 기존 EC2 서버 재사용</title>
<desc>신규 인프라(RDS/ElastiCache/ECS 등) 없이 jjh7757/TIL에 이미 구축된 상시 EC2(deploy-server) 하나에 세 번째 앱으로 얹은 구조. GitHub Actions가 OIDC로 임시 자격증명을 받아 ECR에 이미지를 푸시하고 SSM Run Command로 서버에서 docker compose pull 후 up -d를 실행한다. Caddy가 서브도메인별로 라우팅하고 자동으로 HTTPS 인증서를 발급한다. virtual-financial-services 컨테이너만 신규이고, Postgres/Redis는 다른 앱들과 공유하는 기존 컨테이너에 database/index만 새로 추가했다. 8번 다이어그램(React+ECS/App Runner 안)은 검토 후 폐기됨 — 배포_설계.md 상단 참고.</desc>
<defs>
<style>
  .c-gray rect{fill:#2C2C2A;stroke:#5F5E5A}
  .c-teal rect{fill:#085041;stroke:#5DCAA5}
  .c-purple rect{fill:#3C3489;stroke:#7F77DD}
  .c-dim rect{fill:#232321;stroke:#4A4944;stroke-dasharray:3,3}
  .th{font:500 14px sans-serif;fill:#EDECE6}
  .ts{font:400 12px sans-serif;fill:#A6A49B}
  .c-teal .th, .c-teal .ts{fill:#E1F5EE}
  .c-purple .th, .c-purple .ts{fill:#EEEDFE}
  .c-dim .th{fill:#8B8A85}
  .c-dim .ts{fill:#6E6D68}
  .arr{stroke:#73726c;stroke-width:1.5;fill:none}
  .lbl{font:400 11px sans-serif;fill:#9C9B95}
  .boundary{fill:none;stroke:#4A4944;stroke-width:1.5;stroke-dasharray:5,4}
  .bt{font:500 12px sans-serif;fill:#8B8A85}
</style>
<marker id="arrow9" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="800" height="420" fill="#141413"/>

<!-- Client -->
<g class="c-gray">
<rect x="300" y="15" width="160" height="40" rx="8"/>
<text class="th" x="380" y="35" text-anchor="middle" dominant-baseline="central">Client (브라우저)</text>
</g>
<line x1="380" y1="55" x2="380" y2="113" class="arr" marker-end="url(#arrow9)"/>
<text class="lbl" x="388" y="88">HTTPS</text>

<!-- EC2 boundary -->
<rect class="boundary" x="110" y="90" width="560" height="280" rx="10"/>
<text class="bt" x="122" y="106">EC2 deploy-server (ap-northeast-2, 기존 재사용)</text>

<!-- Caddy -->
<g class="c-gray">
<rect x="300" y="115" width="160" height="40" rx="8"/>
<text class="th" x="380" y="135" text-anchor="middle" dominant-baseline="central">Caddy :80/:443</text>
</g>

<!-- row 2: existing apps + new app -->
<g class="c-dim">
<rect x="140" y="195" width="180" height="50" rx="8"/>
<text class="th" x="230" y="213" text-anchor="middle" dominant-baseline="central">기존 앱들</text>
<text class="ts" x="230" y="231" text-anchor="middle" dominant-baseline="central">deploy-test, rag</text>
</g>
<g class="c-purple">
<rect x="380" y="195" width="200" height="50" rx="8"/>
<text class="th" x="480" y="213" text-anchor="middle" dominant-baseline="central">virtual-financial-services</text>
<text class="ts" x="480" y="231" text-anchor="middle" dominant-baseline="central">FastAPI + LangGraph, 신규</text>
</g>

<path d="M380,155 L380,175 L230,175 L230,195" class="arr" marker-end="url(#arrow9)"/>
<path d="M380,155 L380,175 L480,175 L480,195" class="arr" marker-end="url(#arrow9)"/>

<!-- row 3: shared storage -->
<g class="c-teal">
<rect x="300" y="290" width="170" height="50" rx="8"/>
<text class="th" x="385" y="308" text-anchor="middle" dominant-baseline="central">postgres (공용)</text>
<text class="ts" x="385" y="326" text-anchor="middle" dominant-baseline="central">database 신규 추가</text>
</g>
<g class="c-teal">
<rect x="490" y="290" width="170" height="50" rx="8"/>
<text class="th" x="575" y="308" text-anchor="middle" dominant-baseline="central">redis (공용)</text>
<text class="ts" x="575" y="326" text-anchor="middle" dominant-baseline="central">index 0 신규 배정</text>
</g>

<path d="M480,245 L480,267 L385,267 L385,290" class="arr" marker-end="url(#arrow9)"/>
<path d="M480,245 L480,267 L575,267 L575,290" class="arr" marker-end="url(#arrow9)"/>

<!-- pipeline (outside EC2, left) -->
<g class="c-gray">
<rect x="10" y="195" width="90" height="50" rx="8"/>
<text class="th" x="55" y="213" text-anchor="middle" dominant-baseline="central">GitHub Actions</text>
<text class="ts" x="55" y="231" text-anchor="middle" dominant-baseline="central">OIDC+ECR+SSM</text>
</g>
<line x1="100" y1="220" x2="378" y2="220" class="arr" marker-end="url(#arrow9)"/>
<text class="lbl" x="105" y="212">git push (main)</text>

<!-- Gemini (outside EC2, right) -->
<g class="c-gray">
<rect x="690" y="195" width="90" height="50" rx="8"/>
<text class="th" x="735" y="213" text-anchor="middle" dominant-baseline="central">Gemini API</text>
<text class="ts" x="735" y="231" text-anchor="middle" dominant-baseline="central">외부, HTTPS</text>
</g>
<line x1="582" y1="220" x2="688" y2="220" class="arr" marker-end="url(#arrow9)"/>
<text class="lbl" x="595" y="212">대화 호출</text>

</svg>
