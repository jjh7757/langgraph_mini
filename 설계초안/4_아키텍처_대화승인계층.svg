<svg width="100%" viewBox="0 0 680 484" role="img" xmlns="http://www.w3.org/2000/svg">
<title>에이전트 대화 및 승인 오케스트레이션 계층</title>
<desc>Client가 LangGraph Agent에게 자연어로 요청하면, Agent는 실행하지 않고 제안만 하는 Propose Tools를 호출하고, Orchestration Service가 승인·되묻기·복구를 처리하며 PendingRepo에 요청/승인 상태를 저장한 뒤, 승인되면 도메인 서비스 계층으로 내려가는 구조</desc>
<defs>
<style>
  .box{fill:#1C1C1A;stroke:#3C3B37;stroke-width:0.5}
  .c-gray rect{fill:#2C2C2A;stroke:#5F5E5A}
  .c-teal rect{fill:#085041;stroke:#5DCAA5}
  .c-purple rect{fill:#3C3489;stroke:#7F77DD}
  .th{font:500 14px sans-serif;fill:#EDECE6}
  .ts{font:400 12px sans-serif;fill:#A6A49B}
  .c-teal .th, .c-teal .ts{fill:#E1F5EE}
  .c-purple .th, .c-purple .ts{fill:#EEEDFE}
  .arr{stroke:#73726c;stroke-width:1.5;fill:none}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="484" fill="#141413"/>
<g class="c-gray">
<rect x="270" y="40" width="140" height="44" rx="8"/>
<text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central">Client</text>
</g>
<g class="c-teal">
<rect x="230" y="130" width="220" height="56" rx="8"/>
<text class="th" x="340" y="148" text-anchor="middle" dominant-baseline="central">LangGraph Agent</text>
<text class="ts" x="340" y="166" text-anchor="middle" dominant-baseline="central">Tool 호출 제안</text>
</g>
<g class="c-teal">
<rect x="230" y="230" width="220" height="56" rx="8"/>
<text class="th" x="340" y="248" text-anchor="middle" dominant-baseline="central">Propose Tools</text>
<text class="ts" x="340" y="266" text-anchor="middle" dominant-baseline="central">제안만, 실행 없음</text>
</g>
<g class="c-purple">
<rect x="220" y="330" width="240" height="56" rx="8"/>
<text class="th" x="340" y="348" text-anchor="middle" dominant-baseline="central">Orchestration Service</text>
<text class="ts" x="340" y="366" text-anchor="middle" dominant-baseline="central">승인·되묻기·복구</text>
</g>
<g class="c-gray">
<rect x="480" y="330" width="150" height="56" rx="8"/>
<text class="th" x="555" y="348" text-anchor="middle" dominant-baseline="central">PendingRepo</text>
<text class="ts" x="555" y="366" text-anchor="middle" dominant-baseline="central">요청 기록</text>
</g>
<g class="c-purple">
<rect x="245" y="420" width="190" height="44" rx="8"/>
<text class="th" x="340" y="442" text-anchor="middle" dominant-baseline="central">도메인 서비스 →</text>
</g>
<line x1="340" y1="84" x2="340" y2="130" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="186" x2="340" y2="230" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="286" x2="340" y2="330" class="arr" marker-end="url(#arrow)"/>
<line x1="460" y1="358" x2="480" y2="358" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="386" x2="340" y2="420" class="arr" marker-end="url(#arrow)"/>
</svg>
