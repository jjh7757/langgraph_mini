<svg width="100%" viewBox="0 0 680 310" role="img" xmlns="http://www.w3.org/2000/svg">
<title>지금 단계 — 메모리 저장소 구조</title>
<desc>Orchestration이 승인 후 AccountService/CardService/BillingService를 호출하고, 각 서비스는 서로 독립적인 메모리 구현체(MemoryAccountRepository 등)를 쓰며 공유 세션이 없는 구조</desc>
<defs>
<style>
  .c-gray rect{fill:#2C2C2A;stroke:#5F5E5A}
  .c-teal rect{fill:#085041;stroke:#5DCAA5}
  .c-purple rect{fill:#3C3489;stroke:#7F77DD}
  .th{font:500 14px sans-serif;fill:#EDECE6}
  .ts{font:400 12px sans-serif;fill:#A6A49B}
  .c-teal .th, .c-teal .ts{fill:#E1F5EE}
  .c-purple .th, .c-purple .ts{fill:#EEEDFE}
  .arr{stroke:#73726c;stroke-width:1.5;fill:none}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="310" fill="#141413"/>
<g class="c-purple">
<rect x="245" y="40" width="190" height="44" rx="8"/>
<text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central">Orchestration</text>
</g>
<g class="c-teal">
<rect x="40" y="130" width="190" height="44" rx="8"/>
<text class="th" x="135" y="152" text-anchor="middle" dominant-baseline="central">AccountService</text>
</g>
<g class="c-teal">
<rect x="245" y="130" width="190" height="44" rx="8"/>
<text class="th" x="340" y="152" text-anchor="middle" dominant-baseline="central">CardService</text>
</g>
<g class="c-teal">
<rect x="450" y="130" width="190" height="44" rx="8"/>
<text class="th" x="545" y="152" text-anchor="middle" dominant-baseline="central">BillingService</text>
</g>
<g class="c-purple">
<rect x="40" y="230" width="190" height="56" rx="8"/>
<text class="th" x="135" y="248" text-anchor="middle" dominant-baseline="central">AccountRepository</text>
<text class="ts" x="135" y="266" text-anchor="middle" dominant-baseline="central">Memory</text>
</g>
<g class="c-purple">
<rect x="245" y="230" width="190" height="56" rx="8"/>
<text class="th" x="340" y="248" text-anchor="middle" dominant-baseline="central">CardRepository</text>
<text class="ts" x="340" y="266" text-anchor="middle" dominant-baseline="central">Memory</text>
</g>
<g class="c-purple">
<rect x="450" y="230" width="190" height="56" rx="8"/>
<text class="th" x="545" y="248" text-anchor="middle" dominant-baseline="central">BillingRepository</text>
<text class="ts" x="545" y="266" text-anchor="middle" dominant-baseline="central">Memory</text>
</g>
<path d="M340,84 L340,107 L135,107 L135,130" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="84" x2="340" y2="130" class="arr" marker-end="url(#arrow)"/>
<path d="M340,84 L340,107 L545,107 L545,130" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="45" y="100" text-anchor="start">호출</text>
<line x1="135" y1="174" x2="135" y2="230" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="174" x2="340" y2="230" class="arr" marker-end="url(#arrow)"/>
<line x1="545" y1="174" x2="545" y2="230" class="arr" marker-end="url(#arrow)"/>
</svg>
