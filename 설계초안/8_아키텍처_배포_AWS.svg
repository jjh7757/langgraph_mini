<svg width="100%" viewBox="0 0 930 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title>AWS 배포 아키텍처 — 프론트엔드/백엔드/저장소</title>
<desc>브라우저(React SPA)가 CloudFront+S3에서 정적 파일을 받고, ALB를 거쳐 ECS Fargate 위의 FastAPI+LangGraph 에이전트를 호출한다. 에이전트는 RDS Postgres(도메인 데이터+완료 이력), ElastiCache Redis(PendingRepo 승인대기), Secrets Manager(자격증명)를 쓰고 외부 Gemini API를 호출한다. 주의: graph.py의 checkpointer가 InMemorySaver라 ECS 태스크를 1개로 고정하거나 Postgres 기반 checkpointer로 바꿔야 여러 태스크로 확장 가능(배포_설계.md 참고)</desc>
<defs>
<style>
  .c-gray rect{fill:#2C2C2A;stroke:#5F5E5A}
  .c-teal rect{fill:#085041;stroke:#5DCAA5}
  .c-purple rect{fill:#3C3489;stroke:#7F77DD}
  .th{font:500 14px sans-serif;fill:#EDECE6}
  .ts{font:400 12px sans-serif;fill:#A6A49B}
  .c-teal .th, .c-teal .ts{fill:#E1F5EE}
  .c-purple .th, .c-purple .ts{fill:#EEEDFE}
  .arr{stroke:#73726c;stroke-width:1.5;fill:none}
  .note{font:400 11px sans-serif;fill:#8A8880}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="930" height="420" fill="#141413"/>

<g class="c-gray">
<rect x="350" y="20" width="180" height="44" rx="8"/>
<text class="th" x="440" y="42" text-anchor="middle" dominant-baseline="central">Client</text>
</g>

<g class="c-teal">
<rect x="50" y="110" width="260" height="56" rx="8"/>
<text class="th" x="180" y="128" text-anchor="middle" dominant-baseline="central">CloudFront + S3</text>
<text class="ts" x="180" y="146" text-anchor="middle" dominant-baseline="central">React SPA 정적 호스팅</text>
</g>

<g class="c-gray">
<rect x="500" y="110" width="260" height="56" rx="8"/>
<text class="th" x="630" y="128" text-anchor="middle" dominant-baseline="central">ALB (HTTPS)</text>
<text class="ts" x="630" y="146" text-anchor="middle" dominant-baseline="central">api.&lt;domain&gt;</text>
</g>

<g class="c-purple">
<rect x="500" y="210" width="260" height="64" rx="8"/>
<text class="th" x="630" y="230" text-anchor="middle" dominant-baseline="central">ECS Fargate</text>
<text class="ts" x="630" y="250" text-anchor="middle" dominant-baseline="central">FastAPI + LangGraph Agent</text>
</g>

<g class="c-gray">
<rect x="780" y="210" width="130" height="64" rx="8"/>
<text class="th" x="845" y="230" text-anchor="middle" dominant-baseline="central">Gemini API</text>
<text class="ts" x="845" y="250" text-anchor="middle" dominant-baseline="central">google-genai(외부)</text>
</g>

<g class="c-purple">
<rect x="60" y="330" width="220" height="56" rx="8"/>
<text class="th" x="170" y="348" text-anchor="middle" dominant-baseline="central">RDS Postgres</text>
<text class="ts" x="170" y="366" text-anchor="middle" dominant-baseline="central">도메인 데이터 + 완료 이력</text>
</g>

<g class="c-purple">
<rect x="300" y="330" width="220" height="56" rx="8"/>
<text class="th" x="410" y="348" text-anchor="middle" dominant-baseline="central">ElastiCache Redis</text>
<text class="ts" x="410" y="366" text-anchor="middle" dominant-baseline="central">PendingRepo(승인 대기)</text>
</g>

<g class="c-gray">
<rect x="540" y="330" width="220" height="56" rx="8"/>
<text class="th" x="650" y="348" text-anchor="middle" dominant-baseline="central">Secrets Manager</text>
<text class="ts" x="650" y="366" text-anchor="middle" dominant-baseline="central">API Key / DB 자격증명</text>
</g>

<path d="M440,64 L440,86 L180,86 L180,110" class="arr" marker-end="url(#arrow)"/>
<path d="M440,64 L440,86 L630,86 L630,110" class="arr" marker-end="url(#arrow)"/>
<text class="note" x="185" y="100" text-anchor="start">정적 파일</text>
<text class="note" x="635" y="100" text-anchor="start">API 호출(JSON)</text>

<line x1="630" y1="166" x2="630" y2="210" class="arr" marker-end="url(#arrow)"/>
<text class="note" x="640" y="192" text-anchor="start">JWT(requester_id)</text>

<line x1="760" y1="242" x2="780" y2="242" class="arr" marker-end="url(#arrow)"/>

<path d="M630,274 L630,300 L170,300 L170,330" class="arr" marker-end="url(#arrow)"/>
<path d="M630,274 L630,300 L410,300 L410,330" class="arr" marker-end="url(#arrow)"/>
<path d="M630,274 L630,300 L650,300 L650,330" class="arr" marker-end="url(#arrow)"/>
</svg>
